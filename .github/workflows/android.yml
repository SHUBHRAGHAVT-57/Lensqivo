name: Android quality gates
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Install required Android platforms
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Core behavior, Android build, lint and test compilation
        run: bash gradlew :core:check :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Upload development APK and validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lensqivo-development-build
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            core/build/reports/**
